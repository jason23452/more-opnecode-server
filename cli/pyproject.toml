[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-project"
version = "0.1.0"
description = "將本機專案資料夾上傳至 OpenCode 容器"
requires-python = ">=3.10"

[project.scripts]
opencode-project = "opencode_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
