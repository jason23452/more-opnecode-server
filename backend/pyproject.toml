[project]
name = "features-base-api"
version = "0.1.0"
description = "FastAPI Features-Base starter API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
