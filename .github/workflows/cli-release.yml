name: Build standalone CLI release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: opencode-project-windows-x64.exe
            executable: opencode-project.exe
          - runner: macos-15-intel
            asset: opencode-project-macos-x64
            executable: opencode-project
          - runner: macos-15
            asset: opencode-project-macos-arm64
            executable: opencode-project
          - runner: ubuntu-latest
            asset: opencode-project-linux-x64
            executable: opencode-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: python -m pip install pyinstaller pytest ./cli
      - name: Test CLI package
        run: python -m pytest cli/tests -q
      - name: Build standalone executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --paths cli/src --name opencode-project cli/src/opencode_project/cli.py
        shell: bash
      - name: Verify executable
        run: ./dist/${{ matrix.executable }} --help
        shell: bash
      - name: Rename release asset
        run: mv "dist/${{ matrix.executable }}" "dist/${{ matrix.asset }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Attach executables and installer scripts to the tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/* cli/install.ps1 cli/install.sh
          --title "$GITHUB_REF_NAME"
          --generate-notes
