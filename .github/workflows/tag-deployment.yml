name: Build and deploy production images

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish-images:
    name: Build and publish container images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out triggering release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/jason23452/more-opnecode-server-frontend:latest
            ghcr.io/jason23452/more-opnecode-server-frontend:${{ github.ref_name }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/jason23452/more-opnecode-server-backend:latest
            ghcr.io/jason23452/more-opnecode-server-backend:${{ github.ref_name }}

  deploy:
    name: Pull and deploy production images
    needs: publish-images
    runs-on: bojii-system
    environment: production
    permissions:
      contents: read
    env:
      OPENCODE_PASSWORD: ${{ secrets.OPENCODE_PASSWORD }}
      OPENCODE_ADMIN_TOKEN: ${{ secrets.OPENCODE_ADMIN_TOKEN }}
    steps:
      - name: Check out triggering release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull latest images and deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_TAG="${GITHUB_REF_NAME}" scripts/deploy-production.sh
