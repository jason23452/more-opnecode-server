name: Deploy production on version tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: bojii-system
    environment: production
    env:
      OPENCODE_PASSWORD: ${{ secrets.OPENCODE_PASSWORD }}
      OPENCODE_ADMIN_TOKEN: ${{ secrets.OPENCODE_ADMIN_TOKEN }}
    steps:
      - name: Check out triggering release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update production checkout and deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_TAG="${GITHUB_REF_NAME}" scripts/deploy-production.sh
